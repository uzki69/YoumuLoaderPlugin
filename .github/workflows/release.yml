name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # Needed to create GitHub Releases and commit the updated manifest.json

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-deep: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract Tag Version
        id: version
        run: |
          CLEAN_VER="${GITHUB_REF_NAME#v}"
          
          DOT_COUNT=$(echo "$CLEAN_VER" | tr -cd '.' | wc -c)
          if [ "$DOT_COUNT" -eq 2 ]; then
            ZIP_VER="${CLEAN_VER}.0"
          else
            ZIP_VER="${CLEAN_VER}"
          fi

          echo "ZIP_VERSION=${ZIP_VER}" >> $GITHUB_OUTPUT

      - name: Run Publish Script
        run: |
          chmod +x ./publish.sh ./update-manifest.sh
          ./publish.sh "${{ steps.version.outputs.ZIP_VERSION }}"

      - name: Run Manifest Update Script
        run: |
          ./update-manifest.sh "${{ steps.version.outputs.ZIP_VERSION }}" "${{ github.repository }}" "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: versions/YoumuLoader_${{ steps.version.outputs.ZIP_VERSION }}.zip

      - name: Commit Updated manifest.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Check if manifest.json was updated
          if ! git diff --quiet manifest.json; then
            # 2. Save modified manifest to stash
            git stash push manifest.json

            # 3. Fetch latest origin/main state
            git fetch origin main

            # 4. Align local tree with origin/main without changing branches
            git reset --soft origin/main

            # 5. Restore modified manifest.json
            git stash pop

            # 6. Stage, commit, and push directly to main
            git add manifest.json
            git commit -m "chore: update manifest.json for ${{ github.ref_name }}"
            git push origin HEAD:main
          else
            echo "No changes detected in manifest.json"
          fi