name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract Tag Version
        id: version
        run: |
          CLEAN_VER="${GITHUB_REF_NAME#v}"
          
          DOT_COUNT=$(echo "$CLEAN_VER" | tr -cd '.' | wc -c)
          
          if [ "$DOT_COUNT" -eq 2 ]; then
            ZIP_VER="${CLEAN_VER}.0"
          else
            ZIP_VER="${CLEAN_VER}"
          fi

          echo "ZIP_VERSION=${ZIP_VER}" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "BRANCH=release/${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Run Publish Script
        run: |
          chmod +x ./publish.sh ./update-manifest.sh
          ./publish.sh "${{ steps.version.outputs.ZIP_VERSION }}"

      - name: Run Manifest Update Script
        run: |
          ./update-manifest.sh \
            "${{ steps.version.outputs.ZIP_VERSION }}" \
            "${{ github.repository }}" \
            "${{ steps.version.outputs.TAG }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          files: versions/YoumuLoader_${{ steps.version.outputs.ZIP_VERSION }}.zip
          generate_release_notes: true

      - name: Commit & Push to Release Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ steps.version.outputs.BRANCH }}"

          if git diff --quiet -- manifest.json; then
            echo "No changes detected in manifest.json"
            exit 0
          fi

          # Create (or reset) the release branch from the current state
          git checkout -B "$BRANCH"

          git add manifest.json
          git commit -m "chore: update manifest.json for ${{ steps.version.outputs.TAG }}"
          
          # Push the release branch
          git push origin "$BRANCH" --force